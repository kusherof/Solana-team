[package]
name = "week3-solana-cli"
version = "0.1.0"
edition = "2021"
description = "Неделя 3: CLI на Rust с конструкциями для Solana-разработки"

[dependencies]
bs58 = "0.5"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
