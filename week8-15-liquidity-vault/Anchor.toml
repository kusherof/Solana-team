[toolchain]
anchor_version = "0.31.1"
solana_version = "2.1.21"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
liquidity_vault = "96NuHqGCDcUKWXGNuHZeS1wpeMTrpc64Jnh5jVxyLRuU"

[programs.devnet]
liquidity_vault = "96NuHqGCDcUKWXGNuHZeS1wpeMTrpc64Jnh5jVxyLRuU"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Для локальных тестов загружаем в валидатор программу Raydium CLMM
# (собирается скриптом scripts/build-raydium-clmm-local.sh)
[[test.genesis]]
address = "CAMMCzo5YL8w4VFF8KVHrK22GGUsp5VTaW7grrKgrWqK"
program = "tests/fixtures/raydium_clmm.so"
